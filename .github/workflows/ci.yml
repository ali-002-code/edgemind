name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog gcc-riscv64-unknown-elf

      - name: Install EdgeMind changes into Hazard3
        run: make apply-hardware-patches

      - name: Test dot4 RTL
        run: make test RANDOM_TESTS=10000 RANDOM_SEED=0xED6E

      - name: Build benchmark firmware
        run: make firmware
